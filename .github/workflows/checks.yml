name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # setup-python publishes Python 3.8 builds for Ubuntu 24.04.
          - os: ubuntu-24.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --check ontology_jev/static/app.js
      - run: node --check ontology_jev/static/workbench.js
      - run: node --test tests/test_workbench.js
      - run: python -m ontology_jev demo
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - run: python -I scripts/check_installed.py
